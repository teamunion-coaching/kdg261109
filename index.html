<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>내신 카운트다운</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#F2F1EA; --card:#FFFFFF; --ink:#16211C; --ink2:#5A665F; --ink3:#939E97;
  --line:#E1E5DC; --deep:#22453A; --brand:#0B8A6E; --brand-bg:#E6F5F0;
  --done:#1F9D6B; --done-bg:#E4F4EC; --miss:#B7BEB8;
  --warn:#D2544A; --warn-bg:#FBEAE8;
  --red:#D2544A; --red-bg:#FBEAE8; --yellow:#C6892B; --yellow-bg:#FAF1DE; --green:#1F9D6B; --green-bg:#E4F4EC;
  --sub-eng:#2F6FB0; --sub-kor:#B0562F; --sub-math:#3E7C4F; --sub-memo:#8A6D3B; --sub-etc:#5A665F;
  --now:#0B8A6E; --now-bg:#E6F5F0;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 15px 150px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}

/* header */
header{padding:16px 12px 12px;position:sticky;top:0;background:var(--paper);z-index:30;margin:0 -12px;box-shadow:0 6px 10px -8px rgba(22,33,28,.18);border-bottom:1px solid var(--line)}
h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
h1 em{font-style:normal;color:var(--brand)}
.meta{color:var(--ink2);font-size:13px}
.namebox{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.namebox label{font-size:12px;font-weight:800;color:var(--deep);white-space:nowrap}
.namebox input{flex:1;max-width:180px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--sans);font-size:15px;font-weight:700;color:var(--ink)}
.namebox input:focus{outline:none;border-color:var(--brand)}
.ddaywrap{display:flex;align-items:baseline;gap:10px;margin:8px 0 2px}
.dday{font-family:var(--mono);font-weight:800;font-size:30px;color:var(--deep);letter-spacing:-.02em}
.dday small{font-size:14px;color:var(--ink3);font-weight:700;margin-left:2px}
.examdate{font-size:12.5px;color:var(--ink2)}
.mode{margin:8px 0 2px;background:var(--warn-bg);border:1px solid #F1C9C4;color:#A23A31;border-radius:11px;padding:8px 11px;font-size:12.5px}
.pbar{margin-top:11px;background:#E7EAE3;border-radius:99px;height:12px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,#2ABF8E,#0B8A6E);width:0;transition:width .3s}
.pnum{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.pnum b{font-size:19px;font-weight:800;color:var(--deep)}
.pnum span{font-size:12px;color:var(--ink3)}

/* phase stepper */
.stepper{display:flex;gap:6px;margin:16px 0 4px}
.step{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 4px;position:relative}
.step .pc{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--ink3)}
.step .pn{font-size:11.5px;font-weight:700;color:var(--ink2);margin-top:2px;line-height:1.25}
.step.on{background:var(--now-bg);border-color:#9FD8C8}
.step.on .pc{color:var(--brand)}
.step.on .pn{color:var(--deep)}
.step.done .pc:after{content:" ✓";color:var(--done)}

/* section title */
.stitle{display:flex;align-items:center;gap:8px;margin:22px 2px 8px}
.stitle h2{font-size:14px;font-weight:800;color:var(--deep);margin:0;letter-spacing:-.01em}
.stitle .line{flex:1;height:1px;background:var(--line)}
.stitle .hint{font-size:11px;color:var(--ink3);font-weight:600}

/* read counters */
.reads{display:flex;flex-direction:column;gap:9px}
.readrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 13px}
.readrow .rname{font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px}
.readrow .rlab{font-size:11.5px;color:var(--ink3);font-weight:600}
.readrow .rctl{margin-left:auto;display:flex;align-items:center;gap:9px}
.stepbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#FAFBF8;font-size:19px;font-weight:800;color:var(--deep);line-height:1;display:flex;align-items:center;justify-content:center}
.stepbtn:active{background:var(--brand-bg)}
.rcount{font-family:var(--mono);font-weight:800;font-size:15px;min-width:52px;text-align:center}
.rcount b{color:var(--brand)} .rcount.full b{color:var(--done)}

/* coach tip cards */
.tipcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin:11px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.tiphead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tsubname{font-size:15.5px;font-weight:800;color:var(--deep);display:flex;align-items:center;gap:7px}
.lv{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px}
.lv-red{background:var(--red-bg);color:var(--red)} .lv-yellow{background:var(--yellow-bg);color:var(--yellow)} .lv-green{background:var(--green-bg);color:var(--green)}
.wklabel{font-size:11.5px;font-weight:800;color:var(--warn);margin:10px 0 3px}
.wkedit{width:100%;border:1px dashed #E0C4C0;background:#FDF6F5;border-radius:9px;padding:8px 11px;font-family:var(--sans);font-size:13.5px;color:var(--ink);resize:vertical;min-height:38px}
.wkedit:focus{outline:none;border-color:var(--warn);border-style:solid;background:#fff}
.tiplab{font-size:12px;font-weight:800;color:var(--brand);margin:11px 0 4px;display:flex;align-items:center;gap:6px}
.tiplist{margin:0;padding-left:2px;list-style:none}
.tiplist li{font-size:13.5px;color:var(--ink);margin:5px 0;padding-left:16px;position:relative;line-height:1.5}
.tiplist li:before{content:"·";position:absolute;left:4px;color:var(--brand);font-weight:900}
.approach{margin-top:11px;background:#F3F7FB;border:1px solid #D7E4F1;border-radius:11px;padding:10px 12px}
.approach .ahd{font-size:12.5px;font-weight:800;color:var(--sub-eng);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.approach ol{margin:0;padding-left:20px}
.approach li{font-size:13px;color:#254B6B;margin:4px 0}

/* week card */
.week{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 15px 13px;margin:13px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.week.now{border-color:#9FD8C8;box-shadow:0 0 0 2px var(--now-bg)}
.whead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wno{font-weight:800;font-size:16px;color:var(--deep)}
.wdate{font-size:12px;color:var(--ink3);font-family:var(--mono)}
.wphase{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--brand-bg);color:var(--brand)}
.nowtag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--now);color:#fff}
.wrate{margin-left:auto;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink3)}
.wgoal{font-size:13.5px;color:var(--ink2);margin:8px 0 2px;background:#FAFBF8;border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.wgoal b{color:var(--deep)}
.block{margin-top:11px}
.blab{font-size:12px;font-weight:800;color:var(--deep);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.blab .tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px}
.tag-wd{background:var(--brand-bg);color:var(--brand)} .tag-we{background:#EDEAF7;color:#6B54C6}
.task{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-top:1px solid #F0F2ED;cursor:pointer}
.task:first-of-type{border-top:none}
.cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.15s}
.cb svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:.15s}
.task.done .cb{background:var(--done);border-color:var(--done)}
.task.done .cb svg{opacity:1;transform:scale(1)}
.task.done .ttext{color:var(--ink3);text-decoration:line-through}
.tsub{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;color:#fff;flex:none;margin-top:2px}
.s-eng{background:var(--sub-eng)}.s-kor{background:var(--sub-kor)}.s-math{background:var(--sub-math)}.s-memo{background:var(--sub-memo)}.s-etc{background:var(--sub-etc)}
.ttext{font-size:13.5px;line-height:1.45}

/* editable blocks */
.editblock{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin:10px 0}
.editblock label{font-size:12.5px;font-weight:800;color:var(--deep);display:block;margin-bottom:6px}
.editblock textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--sans);font-size:13.5px;resize:vertical;min-height:56px;color:var(--ink)}
.editblock textarea:focus{outline:none;border-color:var(--brand)}

/* footer bar */
.footbar{position:fixed;left:0;right:0;bottom:0;background:rgba(242,241,234,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:40}
.footinner{max-width:640px;margin:0 auto;padding:10px 15px;display:flex;align-items:center;gap:10px}
.saved{font-size:12px;color:var(--ink3);font-family:var(--mono)}
.saved b{color:var(--done)}
.submitbtn{margin-left:auto;font-size:13.5px;font-weight:800;color:#fff;background:var(--brand);border:none;border-radius:10px;padding:10px 16px;box-shadow:0 2px 6px rgba(11,138,110,.28)}
.submitbtn:active{background:#097056}
.resetbtn{font-size:12px;font-weight:700;color:var(--ink2);background:none;border:1px solid var(--line);border-radius:9px;padding:8px 11px}
.resetbtn:active{background:var(--warn-bg);color:var(--warn);border-color:#F1C9C4}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:var(--deep);color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:700;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">내신 카운트다운</div>
    <h1 id="title"></h1>
    <div class="namebox"><label for="nameInput">이름</label><input id="nameInput" type="text" placeholder="이름을 입력하세요" autocomplete="off"></div>
    <div class="meta" id="submeta"></div>
    <div class="ddaywrap"><div class="dday" id="dday">D-–</div><div class="examdate" id="examdate"></div></div>
    <div class="mode" id="mode" style="display:none"></div>
    <div class="pbar"><div class="pfill" id="pfill"></div></div>
    <div class="pnum"><b id="ppct">0%</b><span id="pdetail"></span></div>
    <div class="stepper" id="stepper"></div>
  </header>

  <div class="stitle" id="readstitle" style="display:none"><h2>회독 진행</h2><div class="line"></div><span class="hint">공부할 때마다 ＋</span></div>
  <div class="reads" id="reads"></div>

  <div class="stitle"><h2 id="tiptitle">코치의 팁!</h2><div class="line"></div><span class="hint">약점은 직접 고쳐도 돼요</span></div>
  <div id="tips"></div>

  <div class="stitle"><h2>주차별 계획</h2><div class="line"></div><span class="hint">한 것에 체크</span></div>
  <div id="weeks"></div>

  <div class="stitle"><h2>강점 · 메모</h2><div class="line"></div></div>
  <div class="editblock">
    <label for="strengths">내 강점 · 자신 있는 것 (선택)</label>
    <textarea id="strengths" placeholder="예: 영어 듣기, 수학 계산은 자신 있어요."></textarea>
  </div>
  <div class="editblock">
    <label for="note">이번 구간 컨디션 · 못한 것 · 코치에게 남길 말</label>
    <textarea id="note" placeholder="예: 이번 주 수학이 밀렸어요. 통합사회는 재밌었어요."></textarea>
  </div>
</div>

<div class="footbar"><div class="footinner">
  <div class="saved" id="saved">자동 저장 <b>✓</b></div>
  <button class="resetbtn" id="reset">초기화</button>
  <button class="submitbtn" id="submit">📤 제출 파일 만들기</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const DATA = {"student": "김동건", "grade": "고2", "school": "호남고", "exam_name": "2학기 기말고사", "exam_start": "2026-12-08", "generated_on": "2026-11-08", "course": "4주", "consultant": "팀유니온", "mode_note": "", "strengths": "", "phases": [{"code": "P1", "name": "준비"}, {"code": "P2", "name": "내용학습"}, {"code": "P3", "name": "문제·오답"}, {"code": "P4", "name": "실전·정리"}], "subjects": [{"name": "물질과 에너지", "key": "memo", "level": "yellow", "level_label": "보완", "weakness": "2학기 중간 원점수 81·2등급으로 7과목 중 상대 위치가 가장 뒤였어. 선택형 2 오답이 모두 용액의 총괄성(선지 방향 함정·끓는점 오름 자료·계산)에 몰렸고, 서답형 −12.0로 7과목 중 손실 최대. 1학기 화학의 자료해석 약점('자료→몰→관계식' 절차 미자동화)이 그대로 이어진 결이야. 선택형 20문항 중 18개 정답으로 개념·기본 자료해석은 안정이니, 기말에선 '관계식 한 줄 고정 + <보기> 개별 O/X + 서답형 단계 서술'을 손에 붙이는 게 등급 회복의 열쇠. 한의예과 지망이라 과학 등급 방어가 특히 중요해.", "goal_reads": 3, "read_label": "개념·문제 회독", "tips": ["자료해석·계산 대표 유형을 '정의/반응식 → 필요한 양으로 환산 → 핵심 관계식·법칙 → 방정식 → 검산' 5단계로 5~7개씩 3회독하자. 문제 옆에 쓰는 관계식(ΔT=K·m, C₁V₁=C₂V₂)을 한 줄로 먼저 고정하자.", "'현상 판단형'은 변화 방향(무엇이 오르고 내리는가)을 표로 못 박고, <보기> ㄱㄴㄷ을 각각 O/X로 개별 판정한 뒤 조합 선지를 고르자('감'으로 소거 금지).", "학교 수업자료·학교 기출을 1순위로 완벽히 하자. 수능형 기출은 자료해석 훈련용 보조로만 쓰고, 난이도 잣대는 학교 범위로 좁히자."], "approach": ["자료·그래프 문항은 축·단위·고정 조건을 먼저 확인하고, 계산형은 핵심 공식을 백지로 재현한 뒤 대입한다.", "<보기>는 ㄱ·ㄴ·ㄷ을 각각 O/X로 판정하고 근거 자료·개념을 지목한 뒤 조합 선지를 고른다. 계산형은 '핵심 변수'가 무엇인지 매번 먼저 적는다.", "서답형은 '정의/조건 → 필요한 양 환산 → 관계식 대입 → 답+단위'를 한 줄씩 남긴다('과정 없이 답만 쓰면 감점' 주의)."]}, {"name": "세포와 물질대사", "key": "memo", "level": "green", "level_label": "강점", "weakness": "2학기 중간 원점수 92·1등급으로 1학기 생명(2등급)에서 등급을 끌어올렸어. 선택형 16문항 중 단백질 미세 개념 1 오답·서답형 −3.5가 '지필 만점' 기준에서 남은 과제야. 개념 정착은 매우 탄탄하니, 기말에선 미세 개념 선지 판정과 서답형 '판단 → 근거 → 결론' 완결만 메우면 만점이 사정권. (직접 다듬어도 돼)", "goal_reads": 3, "read_label": "개념·문제 회독", "tips": ["미세 개념이 갈리는 단원(단백질 구조·결합 등)은 결정 요인·정의를 '한 줄'로 못 박고, <보기> 진술을 각각 O/X로 판정하자.", "서답형은 '판단 → 근거 → 결론 한 문장' 틀로 배점 단계를 하나씩 명시하자. 헷갈리는 쌍(동화↔이화·단순↔촉진확산·원핵↔진핵)은 '차이 한 줄' 비교표로 정리하자.", "선택형은 이미 강점이니 가볍게 감을 유지하고, 남는 시간을 서답형 완결성 훈련에 배분하자."], "approach": ["<보기> ㄱㄴㄷ은 각각 근거 자료·개념을 지목해 O/X로 판정한 뒤 조합 선지를 고른다.", "서답형은 '판단 → 근거 → 결론'을 줄 나눠 쓰 const SUBKEYS = ["eng","kor","math","memo","etc"];
const PHASES = [{"code": "P1", "name": "준비"}, {"code": "P2", "name": "내용학습"}, {"code": "P3", "name": "문제·오답"}, {"code": "P4", "name": "실전·정리"}];
const skey = k => SUBKEYS.includes(k) ? k : "etc";
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STORE = "naesin_" + (DATA.student||"student") + "_" + (DATA.exam_name||"exam");

function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseD(s){ const [y,m,d]=s.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setHours(0,0,0,0); return dt; }
function fmt(s){ const [y,m,d]=s.split("-").map(Number); return `${m}/${d}`; }
function diffDays(a,b){ return Math.round((b-a)/86400000); }

// ---- state ----
let state = {name:"", weaknesses:{}, strengths:"", tasks:{}, reads:{}, note:""};
try{ const raw=localStorage.getItem(STORE); if(raw) state=Object.assign(state,JSON.parse(raw)); }catch(e){}
if(!state.name) state.name = DATA.student || "";
let savedTimer=null;
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(state));
    const el=document.getElementById("saved"); el.innerHTML='저장 중…'; clearTimeout(savedTimer);
    savedTimer=setTimeout(()=>{ el.innerHTML='자동 저장 <b>✓</b>'; },500);
  }catch(e){}
}
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2600); }
function curName(){ return (state.name||DATA.student||"학생").trim() || "학생"; }

// ---- header ----
document.getElementById("title").innerHTML = "<em>" + esc(DATA.exam_name||"내신 대비") + "</em>";
const smeta=[DATA.grade,DATA.school,(DATA.course||"")+" 과정"].filter(Boolean).map(esc).join(" · ");
document.getElementById("submeta").textContent = smeta;
if(DATA.mode_note){ const m=document.getElementById("mode"); m.style.display="block"; m.textContent="⚠ "+DATA.mode_note; }
if(DATA.consultant){ document.getElementById("eyebrow").textContent = "내신 카운트다운 · 담당 "+esc(DATA.consultant); }
const nameInput=document.getElementById("nameInput");
nameInput.value = state.name||"";
function josaEul(name){
  const c=(name||"").trim().slice(-1); if(!c) return "을(를)";
  const code=c.charCodeAt(0);
  if(code>=0xAC00 && code<=0xD7A3) return ((code-0xAC00)%28)?"을":"를";
  return "을(를)";
}
function refreshName(){ const n=curName(); document.getElementById("tiptitle").textContent = n+josaEul(n)+" 위한 코치의 팁!"; }
nameInput.addEventListener("input",()=>{ state.name=nameInput.value; refreshName(); save(); });

function renderDday(){
  const t=today(), ex=parseD(DATA.exam_start), n=diffDays(t,ex);
  const el=document.getElementById("dday");
  if(n>0) el.innerHTML="D-"+n+"<small> 일 남음</small>";
  else if(n===0) el.innerHTML="D-DAY<small> 시험일</small>";
  else el.innerHTML="D+"+(-n)+"<small> 시험 지남</small>";
  document.getElementById("examdate").textContent = "시험 시작 "+fmt(DATA.exam_start);
}
function currentPhase(){
  const t=today();
  for(const w of DATA.weeks){ if(t>=parseD(w.start) && t<=parseD(w.end)) return w.phase; }
  if(t < parseD(DATA.weeks[0].start)) return DATA.weeks[0].phase;
  return DATA.weeks[DATA.weeks.length-1].phase;
}
function renderStepper(){
  const cur=currentPhase(), curIdx=PHASES.findIndex(p=>p.code===cur);
  document.getElementById("stepper").innerHTML = PHASES.map((p,i)=>{
    const cls = p.code===cur ? "step on" : (i<curIdx ? "step done" : "step");
    return `<div class="${cls}"><div class="pc">${p.code}</div><div class="pn">${esc(p.name)}</div></div>`;
  }).join("");
}
function subColor(k){ return {eng:"var(--sub-eng)",kor:"var(--sub-kor)",math:"var(--sub-math)",memo:"var(--sub-memo)",etc:"var(--sub-etc)"}[skey(k)]; }

// ---- read counters ----
function renderReads(){
  const wrap=document.getElementById("reads");
  if(!DATA.reads||!DATA.reads.length){ return; }
  document.getElementById("readstitle").style.display="flex";
  wrap.innerHTML = DATA.reads.map((r,i)=>{
    const id="r"+i, cur=state.reads[id]||0, full=cur>=r.goal;
    return `<div class="readrow">
      <div><div class="rname"><span class="dot" style="width:9px;height:9px;border-radius:99px;background:${subColor(r.key)}"></span>${esc(r.subject)}</div>
      <div class="rlab">${esc(r.label||"회독")}</div></div>
      <div class="rctl">
        <button class="stepbtn" data-r="${id}" data-d="-1">−</button>
        <div class="rcount ${full?'full':''}" id="rc-${id}"><b>${cur}</b> / ${r.goal}${full?' ✓':''}</div>
        <button class="stepbtn" data-r="${id}" data-d="1">＋</button>
      </div></div>`;
  }).join("");
  wrap.querySelectorAll(".stepbtn").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.r, d=+b.dataset.d, goal=DATA.reads[+id.slice(1)].goal;
    let v=(state.reads[id]||0)+d; if(v<0)v=0; if(v>goal+3)v=goal+3;
    state.reads[id]=v; save();
    const rc=document.getElementById("rc-"+id); const full=v>=goal;
    rc.className="rcount "+(full?"full":""); rc.innerHTML=`<b>${v}</b> / ${goal}${full?' ✓':''}`;
  }));
}

// ---- coach tips (with editable weakness) ----
function renderTips(){
  const subs=DATA.subjects||[];
  document.getElementById("tips").innerHTML = subs.map((s,i)=>{
    const lv = s.level==="red"?'<span class="lv lv-red">약점</span>':s.level==="yellow"?'<span class="lv lv-yellow">보완</span>':s.level==="green"?'<span class="lv lv-green">강점</span>':"";
    const wkVal = (state.weaknesses && state.weaknesses[i]!=null) ? state.weaknesses[i] : (s.weakness||"");
    const tipsHTML = (s.tips&&s.tips.length) ? `<div class="tiplab">💡 이렇게 공부하자</div><ul class="tiplist">${s.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>` : "";
    const appHTML = (s.approach&&s.approach.length) ? `<div class="approach"><div class="ahd">🧭 이렇게 풀자 (풀이 접근)</div><ol>${s.approach.map(a=>`<li>${esc(a)}</li>`).join("")}</ol></div>` : "";
    return `<div class="tipcard">
      <div class="tiphead"><div class="tsubname"><span class="dot" style="width:10px;height:10px;border-radius:99px;background:${subColor(s.key)}"></span>${esc(s.name)}</div>${lv}</div>
      <div class="wklabel">📌 나의 약점 · 보완할 점</div>
      <textarea class="wkedit" data-wk="${i}" placeholder="약점을 적거나 고쳐 보세요">${esc(wkVal)}</textarea>
      ${tipsHTML}${appHTML}
    </div>`;
  }).join("");
  document.getElementById("tips").querySelectorAll(".wkedit").forEach(t=>{
    t.addEventListener("input",()=>{ state.weaknesses[t.dataset.wk]=t.value; save(); });
    t.addEventListener("input",autoGrow); autoGrow.call(t);
  });
}
function autoGrow(){ this.style.height="auto"; this.style.height=(this.scrollHeight+2)+"px"; }

// ---- weeks ----
const CHECK='<svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 6" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const TASKMAP={};
function taskHTML(t,wi,blk,ti){
  const id=`t-${wi}-${blk}-${ti}`, done=!!state.tasks[id];
  TASKMAP[id]={week:DATA.weeks[wi].no, blk:blk==="wd"?"주중":"주말", subject:t.subject, text:t.text};
  return `<div class="task ${done?'done':''}" data-t="${id}">
    <div class="cb">${CHECK}</div>
    <span class="tsub s-${skey(t.key)}">${esc(t.subject)}</span>
    <span class="ttext">${esc(t.text)}</span></div>`;
}
function isNowWeek(w){ const t=today(); return t>=parseD(w.start)&&t<=parseD(w.end); }
function renderWeeks(){
  const host=document.getElementById("weeks");
  host.innerHTML = DATA.weeks.map((w,wi)=>{
    const now=isNowWeek(w);
    const wd=(w.weekday||[]).map((t,ti)=>taskHTML(t,wi,"wd",ti)).join("");
    const we=(w.weekend||[]).map((t,ti)=>taskHTML(t,wi,"we",ti)).join("");
    const ph=PHASES.find(p=>p.code===w.phase);
    return `<div class="week ${now?'now':''}" id="wk-${wi}">
      <div class="whead">
        <span class="wno">${w.no}주차</span>
        <span class="wdate">${fmt(w.start)}–${fmt(w.end)}</span>
        <span class="wphase">${esc(w.phase_name||(ph?ph.name:w.phase))}</span>
        ${now?'<span class="nowtag">이번 주</span>':''}
        <span class="wrate" id="wr-${wi}"></span>
      </div>
      ${w.goal?`<div class="wgoal"><b>목표</b> · ${esc(w.goal)}</div>`:''}
      ${wd?`<div class="block"><div class="blab"><span class="tag tag-wd">주중</span> 내용학습</div>${wd}</div>`:''}
      ${we?`<div class="block"><div class="blab"><span class="tag tag-we">주말</span> 문제집 풀이</div>${we}</div>`:''}
    </div>`;
  }).join("");
  host.querySelectorAll(".task").forEach(el=>el.addEventListener("click",()=>{
    const id=el.dataset.t; state.tasks[id]=!state.tasks[id];
    el.classList.toggle("done",state.tasks[id]); save(); updateProgress();
  }));
}
function allTaskIds(){
  const ids=[];
  DATA.weeks.forEach((w,wi)=>{
    (w.weekday||[]).forEach((_,ti)=>ids.push(`t-${wi}-wd-${ti}`));
    (w.weekend||[]).forEach((_,ti)=>ids.push(`t-${wi}-we-${ti}`));
  });
  return ids;
}
function updateProgress(){
  const ids=allTaskIds(), total=ids.length, done=ids.filter(i=>state.tasks[i]).length;
  const pct= total? Math.round(done/total*100):0;
  document.getElementById("pfill").style.width=pct+"%";
  document.getElementById("ppct").textContent=pct+"%";
  document.getElementById("pdetail").textContent=`${done} / ${total} 과제`;
  DATA.weeks.forEach((w,wi)=>{
    const wids=[]; (w.weekday||[]).forEach((_,ti)=>wids.push(`t-${wi}-wd-${ti}`));
    (w.weekend||[]).forEach((_,ti)=>wids.push(`t-${wi}-we-${ti}`));
    const d=wids.filter(i=>state.tasks[i]).length;
    const el=document.getElementById("wr-"+wi); if(el) el.textContent= wids.length? `${d}/${wids.length}`:"";
  });
}

// ---- editable strengths / note ----
const strEl=document.getElementById("strengths");
strEl.value=state.strengths||DATA.strengths||"";
strEl.addEventListener("input",()=>{ state.strengths=strEl.value; save(); });
const noteEl=document.getElementById("note");
noteEl.value=state.note||"";
noteEl.addEventListener("input",()=>{ state.note=noteEl.value; save(); });

// ---- submit (export JSON) ----
function buildSubmission(){
  const ids=allTaskIds(), total=ids.length, done=ids.filter(i=>state.tasks[i]).length;
  const weeks=DATA.weeks.map((w,wi)=>{
    const wids=[]; (w.weekday||[]).forEach((_,ti)=>wids.push(`t-${wi}-wd-${ti}`));
    (w.weekend||[]).forEach((_,ti)=>wids.push(`t-${wi}-we-${ti}`));
    const d=wids.filter(i=>state.tasks[i]).length;
    return {no:w.no, phase:w.phase, phase_name:w.phase_name||"", done:d, total:wids.length};
  });
  const reads=(DATA.reads||[]).map((r,i)=>({subject:r.subject,key:r.key,label:r.label||"회독",goal:r.goal,count:state.reads["r"+i]||0}));
  const weaknesses=(DATA.subjects||[]).map((s,i)=>({subject:s.name,key:s.key,level:s.level||"",
    weakness:(state.weaknesses&&state.weaknesses[i]!=null)?state.weaknesses[i]:(s.weakness||"")}));
  const doneTasks=ids.filter(i=>state.tasks[i]).map(i=>TASKMAP[i]).filter(Boolean);
  const undoneTasks=ids.filter(i=>!state.tasks[i]).map(i=>TASKMAP[i]).filter(Boolean);
  return {
    type:"naesin_countdown_submission", v:1,
    student: curName(), exam_name:DATA.exam_name||"", exam_start:DATA.exam_start||"", course:DATA.course||"",
    consultant: DATA.consultant||"", submitted_at: new Date().toISOString().slice(0,10),
    summary:{ done, total, pct: total?Math.round(done/total*100):0, weeks, reads },
    weaknesses, strengths: state.strengths||DATA.strengths||"", note: state.note||"",
    done_tasks: doneTasks, undone_tasks: undoneTasks
  };
}
function download(name, obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
document.getElementById("submit").addEventListener("click",()=>{
  if(!curName() || curName()==="학생"){ if(!confirm("이름이 비어 있어요. 그래도 만들까요?")) { nameInput.focus(); return; } }
  const sub=buildSubmission();
  const fname=`[제출]_${curName()}_내신카운트다운.json`;
  download(fname, sub);
  toast("제출 파일을 만들었어요! 코치쌤께 보내 주세요 📤");
});

// ---- reset ----
document.getElementById("reset").addEventListener("click",()=>{
  if(confirm("모든 체크·회독·약점 메모를 초기화할까요? (되돌릴 수 없어요)")){
    state={name:DATA.student||"",weaknesses:{},strengths:"",tasks:{},reads:{},note:""};
    try{localStorage.removeItem(STORE);}catch(e){}
    location.reload();
  }
});

// ---- init ----
refreshName(); renderDday(); renderStepper(); renderReads(); renderTips(); renderWeeks(); updateProgress();
const nowIdx=DATA.weeks.findIndex(isNowWeek);
if(nowIdx>=0){ setTimeout(()=>{ const el=document.getElementById("wk-"+nowIdx); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); },400); }
</script>
